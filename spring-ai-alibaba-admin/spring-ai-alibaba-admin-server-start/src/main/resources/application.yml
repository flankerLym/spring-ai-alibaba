server:
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript
    min-response-size: 2048
  port: ${SAA_SERVER_PORT:8080}
#  port: ${SAA_SERVER_PORT:18999}
nacos:
  # 支持通过环境变量 NACOS_SERVER_ADDR 覆盖，默认值在各个 profile 中定义
  server-addr: ${SAA_NACOS_SERVER_ADDR}
management:
  tracing:
    sampling:
      probability: 1.0
  metrics:
    enable:
      reactor.netty.connection.provider: true
  otlp:
    tracing:
      export:
        enabled: false
      # 支持通过环境变量 MANAGEMENT_OTLP_TRACING_EXPORT_ENDPOINT 覆盖，默认值在各个 profile 中定义
      #endpoint: ${MANAGEMENT_OTLP_TRACING_EXPORT_ENDPOINT}
    metrics:
      export:
        enabled: false
    logging:
      export:
        enabled: false
  opentelemetry:
    resource-attributes:
      service:
        # shouldn't be changed
        name: spring-ai-alibaba-studio
        version: 1.0
      deployment:
        environment: test
  endpoints:
    web:
      base-path: /actuator
  endpoint:
    health:
      show-details: always
spring:
  ai:
    chat:
      client:
        observations:
          log-prompt: true
      observations:
        log-prompt: true
        log-completion: true
    image:
      observations:
        log-prompt: true
    vectorstore:
      observations:
        log-query-response: true
    alibaba:
      arms:
        enabled: true
        model:
          capture-input: true
          capture-output: true
      studio:
        workflow:
          node-timeout-seconds: 1000
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 500MB
      enabled: true
  application:
    name: saa-studio
  config:
    import:
      - classpath:initializr.yml
      - classpath:elasticsearch.yml
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    # 支持通过环境变量覆盖，默认值在各个 profile 中定义
    # SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
    url: ${SAA_DATASOURCE_URL:jdbc:postgresql://172.16.20.231:5432/saa}
    username: ${SAA_DATASOURCE_USERNAME:psy_dev}
    password: ${SAA_DATASOURCE_PASSWORD:znxl_dev_123}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      filters: wall,slf4j
      filter:
        stat:
          log-slow-sql: true
          slow-sql-millis: 1000
          enabled: true
        slf4j:
          enabled: true
          statement-executable-sql-log-enable: true
          statement-log-error-enabled: true
  data:
    redis:
      # 支持通过环境变量覆盖，默认值在各个 profile 中定义
      # SPRING_REDIS_HOST, SPRING_REDIS_PORT, SPRING_REDIS_DATABASE
      host: ${SAA_REDIS_HOST:172.16.20.230}
      port: ${SAA_REDIS_PORT:6379}
      password: ${SAA_REDIS_PASSWORD:bjdx_icode}
      database: ${SAA_REDIS_DATABASE:3}
  freemarker:
    cache: false
    charset: UTF-8
    suffix: .html
    enabled: true
    content-type: text/html
    template-loader-path: classpath:/templates/

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
      jakarta:
        persistence:
          jdbc:
            # 使用与 datasource 相同的配置，通过环境变量覆盖
            url: ${SAA_DATASOURCE_URL:jdbc:postgresql://172.16.20.231:5432/saa}
            user: ${SAA_DATASOURCE_USERNAME:psy_dev}
            password: ${SAA_DATASOURCE_PASSWORD:znxl_dev_123}
            driver: org.postgresql.Driver
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.alibaba.cloud.ai.studio.admin.entity
  configuration:
    map-underscore-to-camel-case: true
rocketmq:
  # 支持通过环境变量覆盖，默认值在各个 profile 中定义
  # ROCKETMQ_ENDPOINTS, ROCKETMQ_DOCUMENT_INDEX_TOPIC, ROCKETMQ_DOCUMENT_INDEX_GROUP
  endpoints: ${SAA_ROCKETMQ_ENDPOINTS}
  document-index-topic: ${SAA_ROCKETMQ_DOCUMENT_INDEX_TOPIC:topic_saa_studio_document_index}
  document_index_group: ${SAA_ROCKETMQ_DOCUMENT_INDEX_GROUP:group_saa_studio_document_index}
initializr:
  web:
    enabled: false
logging:
  level:
    org.springframework.boot.autoconfigure: INFO
    org.springframework.boot.task: INFO

# 工作流失败钉钉通知（统一配置在 application.yml）
workflow:
  failure-notification:
    dingtalk:
      enabled: ${WORKFLOW_FAILURE_DINGTALK_ENABLED:false}
      webhook-url: "${DINGTALK_WEBHOOK_URL:https://oapi.dingtalk.com/robot/send?access_token=831f223374eba35c95c5b1e4d3352f0f5a1d8c231118d7546f23577c70e49824}"
      secret: "${DINGTALK_WEBHOOK_SECRET:}"

app:
  dashscope:
    http-client:
      pool:
        max-connections: 200          # 最大连接数，根据并发量调整
        max-idle-time: 20s            # 空闲连接最大存活时间 (必须 < DashScope/SLB 的 keep-alive 超时，通常为 30-60s)
        max-life-time: 60s            # 连接最大生命周期，防止长期复用被服务端 RST
        evict-interval: 10s           # 后台定期扫描并清除无效连接的间隔
        acquire-timeout: 5s           # 从连接池获取连接的超时时间
      timeout:
        connect: 5s                   # TCP 握手超时
        response: 120s                # 响应超时 (大模型生成较慢，需设置较长)
      retry:
        max-attempts: 3               # 最大重试次数
        backoff-delay: 500ms          # 初始退避延迟
        backoff-multiplier: 2.0       # 退避乘数

